[package]
name = "selucid-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Selucid GTK4/Libadwaita desktop app (RHEL/Fedora GNOME)"

[[bin]]
name = "selucid-gui"
path = "src/main.rs"
required-features = ["gui"]

[features]
# Default build stays dependency-free (stub binary that explains the
# missing system headers). The real Libadwaita UI builds with:
#   sudo dnf install gtk4-devel libadwaita-devel
#   cargo run -p selucid-gui --features gui
default = []
gui = ["dep:relm4", "dep:gtk4", "dep:libadwaita", "dep:tokio"]

[dependencies]
selucid-core.workspace = true
relm4 = { version = "0.11", optional = true, features = ["libadwaita"] }
gtk4 = { version = "0.11", package = "gtk4", optional = true }
libadwaita = { version = "0.9", package = "libadwaita", optional = true, features = ["v1_6"] }
tokio = { version = "1", features = ["full"], optional = true }
